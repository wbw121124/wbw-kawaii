[package]
name = "kawaii-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "可爱化引擎纯 Rust 核心（消息 CST / 规则 DSL / 求值）"

[lib]
name = "kawaii_core"

[dependencies]
rowan = "0.17.0"
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
