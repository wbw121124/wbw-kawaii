name: engine

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            package-lock.json

      - name: Cargo test
        run: cargo test --workspace

      - name: Install deps
        run: npm ci

      - name: Build native addon
        run: npm run build

      - name: Build wasm
        run: npm run build:wasm

      - name: Smoke + parity (native ↔ wasm)
        run: npm test

      - name: Install root deps（golden 三跑用）
        run: npm ci
        working-directory: .

      - name: Cache cpptools baseline（golden 覆盖率用）
        uses: actions/cache@v4
        with:
          path: assets/baseline
          key: cpptools-baseline-1.34.4-1.19.7-1.35.3

      - name: Fetch baselines
        run: npm run fetch-baseline
        working-directory: .

      - name: Golden 三跑（tsc + ts / native / wasm，43 测试 × 3）
        run: npm test
        working-directory: .

  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown -p kawaii-wasm

      - name: Smoke wasm
        run: node test/smoke-wasm.cjs
