name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Cache cpptools baseline (vsix 提取产物)
        uses: actions/cache@v4
        with:
          path: assets/baseline
          key: cpptools-baseline-1.34.4-1.19.7-1.35.3

      - name: Install dependencies
        run: npm ci

      - name: Install engine deps
        run: npm ci
        working-directory: engine

      - name: Build engine（release .node + wasm，vsix 运行时四件套）
        run: npm run build && npm run build:wasm
        working-directory: engine

      - name: Fetch baselines
        run: npm run fetch-baseline

      - name: Build rules（含质量门禁：模板率 <= 40%，结构差异率 >= 70%）
        run: npm run build:rules:check

      - name: Check generated rules in sync
        run: git diff --exit-code src/rules.generated.ts

      - name: Test（golden 三跑：ts / native / wasm）
        run: npm test

      - name: Package
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: wbw-kawaii-vsix
          path: "*.vsix"
